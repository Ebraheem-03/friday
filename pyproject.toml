[project]
name = "friday"
version = "0.0.1"
description = "Local voice assistant (Gemini brain, Linux)."
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Runtime dependency pins — ALL versions resolved from PyPI JSON API on
# 2026-06-22 and confirmed stable (no pre-release suffix).
# Sentinel: verify each package name and SHA against its canonical PyPI URL
# before accepting a PR that changes any pin.
#
#   google-genai  -> https://pypi.org/pypi/google-genai/json
#   sounddevice   -> https://pypi.org/pypi/sounddevice/json
#   kokoro        -> https://pypi.org/pypi/kokoro/json
#   browser-use   -> https://pypi.org/pypi/browser-use/json
#   scrapling     -> https://pypi.org/pypi/scrapling/json
#   PyGObject     -> https://pypi.org/pypi/PyGObject/json
# ---------------------------------------------------------------------------
dependencies = [
  "google-genai==2.9.0",      # Gemini brain (streaming + Live) — google.genai import
  "sounddevice==0.5.5",       # Audio capture/playback (runtime, not build-time)
  "kokoro==0.9.4",            # Kokoro-82M local TTS
  "browser-use==0.13.1",      # Browser automation (runtime web agent)
  "scrapling==0.4.9",         # Fast HTML scraping
  "PyGObject==3.56.3",        # AT-SPI / GObject bindings for Linux OS bridge
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Dev/CI pins:
#   pytest         -> https://pypi.org/pypi/pytest/json
#   pytest-asyncio -> https://pypi.org/pypi/pytest-asyncio/json
#   ruff           -> https://pypi.org/pypi/ruff/json
# ---------------------------------------------------------------------------
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.18",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit package list: the repo is a flat layout with several top-level
# packages, so setuptools auto-discovery refuses to guess. `hud/` is an
# Electron/JS app (not importable Python) and is intentionally excluded.
[tool.setuptools]
packages = ["core", "memory", "voice", "web"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Async tests use explicit @pytest.mark.asyncio markers (strict mode).
asyncio_mode = "strict"

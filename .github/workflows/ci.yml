# FRIDAY CI — lint + test (Python) + HUD (JS)
# Triggers on push and PR to dev and main branches.
# PyGObject requires system GObject introspection libraries; installed via apt below.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      # CI installs only the dev extra: google-genai (pure-Python) + test/lint
      # tools. The voice/web/os extras (torch, Playwright, native PyGObject) are
      # intentionally NOT installed here — they are heavy, native, and unneeded
      # for the mocked unit tests. No CUDA is ever pulled in CI.
      - name: Install Python dependencies (dev extra)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  hud:
    name: HUD (Node 20 — typecheck + test + build)
    runs-on: ubuntu-latest
    # Skip Electron binary download (~100 MB) — we only typecheck/test/build
    # the renderer and run pure-function unit tests. Electron is never launched.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    defaults:
      run:
        working-directory: hud

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node 20
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hud/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Vite renderer build
        run: npm run build
